<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <title>第二大腦</title>
  <link rel="stylesheet" href="styles.css?v=project-gateway-v1-20261006" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主要導覽">
      <div class="brand">
        <div class="brand-mark">G</div>
        <div>
          <div class="brand-title">第二大腦</div>
          <div class="brand-subtitle">個人成長作業系統</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="home"><span>⌂</span><b>今天</b></button>
        <button class="nav-item" data-view="projects"><span>◎</span><b>作品</b></button>
        <button class="nav-item" data-view="capabilities"><span>◫</span><b>能力庫</b></button>
        <button class="nav-item" data-view="research"><span>◇</span><b>研究室</b></button>
        <button class="nav-item" data-view="ceo"><span>◉</span><b>團隊</b></button>
        <button class="nav-item" data-view="history"><span>↺</span><b>歷程</b></button>
      </nav>

      <div class="side-note">
        <div class="side-note-title">現在模式</div>
        <div class="status-row"><span class="dot amber"></span><span>私人單人模式</span></div>
        <p>首頁與系統建置分離；登入後首頁只讀個人資料；系統建置資訊只在系統頁載入。</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">個人成長系統</div>
          <h1 id="pageTitle">今天只做一件最值得做的事</h1>
        </div>
        <div class="top-actions">
          <button class="primary-btn global-capture" id="captureBtn">＋ 丟進來</button>
          <button class="ghost-btn" id="refreshBtn">重新整理</button>
          <div class="avatar">劉</div>
        </div>
      </header>

      <section class="view active" id="view-home"></section>
      <section class="view" id="view-projects"></section>
      <section class="view" id="view-capabilities"></section>
      <section class="view" id="view-research"></section>
      <section class="view" id="view-ceo"></section>
      <section class="view" id="view-history"></section>

      <!-- Transitional support views: reachable from context actions, not top-level navigation. -->
      <section class="view" id="view-inbox"></section>
      <section class="view" id="view-learn"></section>
      <section class="view" id="view-synapse"></section>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="config.js"></script>
  <script src="auth.js?v=login-link-help-20261006"></script>
  <script src="adapter.js?v=event-lab-v1-20261006b"></script>
  <script src="event-lab.js?v=event-lab-v1-20261006b"></script>
  <script src="app.js?v=project-gateway-v1-20261006"></script>
  <script src="inbox.js"></script>
</body>
</html>
