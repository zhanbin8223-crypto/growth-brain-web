name: Validate signed-in UX fix

on:
  push:
    branches: ["fix-signedin-ux-20261007"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax and tests
        run: |
          node --check app.js
          node --check adapter.js
          node --check auth.js
          node --check config.js
          node --check data.js
          node --check inbox.js
          node --check event-lab.js
          for f in validation/*.test.mjs; do
            echo "RUN $f"
            node --test "$f"
          done
